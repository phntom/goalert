{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "goalert.fullname" . }}
  labels:
    {{- include "goalert.labels" . | nindent 4 }}
data:
  AUTH_TOKEN: {{ .Values.config.authToken | b64enc | quote }}
  APP_HASH: {{ .Values.config.appHash | b64enc | quote }}
{{- end }}
